<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Calendar Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Clock / Milestone Glow -->
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Drop Shadow for layered elements -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Calendar Outer Body with Shadow -->
  <g filter="url(#dropShadow)">
    <rect x="80" y="110" width="352" height="320" rx="36" fill="#ffffff" />
    
    <!-- Top Red/Coral Calendar Banner -->
    <path d="M 80 146 Q 80 110 116 110 L 396 110 Q 432 110 432 146 L 432 185 L 80 185 Z" fill="url(#headerGrad)" />
  </g>

  <!-- Calendar Rings / Binder Pins -->
  <rect x="145" y="75" width="26" height="65" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" />
  <rect x="341" y="75" width="26" height="65" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" />

  <!-- Central Milestone Clock & Age Needle -->
  <circle cx="256" cy="305" r="95" fill="#f0f9ff" stroke="#e0f2fe" stroke-width="8" />
  <circle cx="256" cy="305" r="80" fill="url(#dialGrad)" />

  <!-- Clock Hour Ticks -->
  <circle cx="256" cy="240" r="4.5" fill="#ffffff" />
  <circle cx="321" cy="305" r="4.5" fill="#ffffff" />
  <circle cx="256" cy="370" r="4.5" fill="#ffffff" />
  <circle cx="191" cy="305" r="4.5" fill="#ffffff" />

  <!-- Clock Hands (Pointing to 9:15 / Birthday Horizon) -->
  <line x1="256" y1="305" x2="256" y2="250" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
  <line x1="256" y1="305" x2="298" y2="305" stroke="#fde047" stroke-width="8" stroke-linecap="round" />
  
  <!-- Center Pin Glow -->
  <circle cx="256" cy="305" r="9" fill="#ffffff" />
  <circle cx="256" cy="305" r="4.5" fill="#1e40af" />

  <!-- Top-Right Sparkle Icon for Celebration & Accuracy -->
  <g transform="translate(385, 80)">
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 -22 0 Z" fill="#fde047" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>
</svg>
