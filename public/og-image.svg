<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Pill Badge -->
  <g transform="translate(480, 110)">
    <rect width="240" height="50" rx="25" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="15" y="10" width="30" height="30" rx="8" fill="#2563eb"/>
    <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#1e40af">agecalculators.dev</text>
  </g>
  
  <!-- Main Title -->
  <text x="600" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" fill="#0f172a" letter-spacing="-1.5">
    Age Calculator
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="500" fill="#475569">
    Calculate your exact age in years, months, and days with calendar precision.
  </text>
  
  <!-- Feature Badges -->
  <g transform="translate(320, 420)">
    <rect width="260" height="60" rx="14" fill="#2563eb"/>
    <text x="130" y="37" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">
      100% Calendar Accurate
    </text>
  </g>
  
  <g transform="translate(620, 420)">
    <rect width="260" height="60" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <text x="130" y="37" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#047857">
      100% Client-Side Private
    </text>
  </g>
</svg>
